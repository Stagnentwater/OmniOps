services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniops-api
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      FASTAPI_APP_NAME: OmniOps API
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      RQ_QUEUE_NAME: default
      RQ_JOB_TIMEOUT_SECONDS: "900"
      RQ_RETRY_MAX: "3"
      RQ_RETRY_INTERVALS_SECONDS: "10,30,60"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: omniops
      POSTGRES_USER: omniops
      POSTGRES_PASSWORD: omniops
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: openai/gpt-4o-mini
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
      EMBEDDING_MODEL_NAME: BAAI/bge-m3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniops-worker
    command: python worker.py
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FASTAPI_APP_NAME: OmniOps API
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      RQ_QUEUE_NAME: default
      RQ_JOB_TIMEOUT_SECONDS: "900"
      RQ_RETRY_MAX: "3"
      RQ_RETRY_INTERVALS_SECONDS: "10,30,60"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: omniops
      POSTGRES_USER: omniops
      POSTGRES_PASSWORD: omniops
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: openai/gpt-4o-mini
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
      EMBEDDING_MODEL_NAME: BAAI/bge-m3

  postgres:
    image: postgres:16-alpine
    container_name: omniops-postgres
    environment:
      POSTGRES_DB: omniops
      POSTGRES_USER: omniops
      POSTGRES_PASSWORD: omniops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniops -d omniops"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.22-community
    container_name: omniops-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: omniops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: omniops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  qdrant_data:
  storage_data:
