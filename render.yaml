services:
  - type: web
    name: omniops-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FASTAPI_APP_NAME
        value: OmniOps API
      - key: FASTAPI_HOST
        value: 0.0.0.0
      - key: FASTAPI_PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-m3
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/storage
      - key: EMBED_WORKER
        value: "true"

  # ------------------------------------------------------------------
  # DEPRECATED FOR HACKATHON: The RQ worker now runs embedded inside
  # the omniops-api web service (controlled by EMBED_WORKER=true).
  # This standalone worker definition is preserved for production
  # deployments where separating the worker is desired.
  # To use it, set EMBED_WORKER=false on the omniops-api service and
  # enable this worker service in Render.
  # ------------------------------------------------------------------
  - type: worker
    name: omniops-worker
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: python worker.py
    autoDeploy: true
    envVars:
      - key: FASTAPI_APP_NAME
        value: OmniOps API
      - key: FASTAPI_HOST
        value: 0.0.0.0
      - key: FASTAPI_PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-m3
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/storage
